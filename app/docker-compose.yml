services:
  traefik:
    image: traefik:v3.6
    container_name: seawealthy-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web-proxy"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-95432531@qq.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--ping=true"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./cert:/certs:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/letsencrypt:/letsencrypt
    restart: unless-stopped
    depends_on:
      haiyingping:
        condition: service_healthy
      tradecal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - web-proxy

  haiyingping:
    build:
      context: .
      dockerfile: Dockerfile
    image: haiyingping-web:latest
    container_name: haiyingping-web
    expose:
      - "80"
    volumes:
      - ./cert:/etc/nginx/cert:ro
      - ./public/atom:/usr/share/nginx/html/atom:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - haiyingping-net
      - web-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seawealthy.rule=Host(`seawealthy.com`) || Host(`www.seawealthy.com`)"
      - "traefik.http.routers.seawealthy.entrypoints=websecure"
      - "traefik.http.routers.seawealthy.tls=true"
      - "traefik.http.services.seawealthy.loadbalancer.server.port=80"

  tradecal:
    image: nginx:alpine
    container_name: tradecal-placeholder
    expose:
      - "80"
    volumes:
      - ./tradecal-placeholder:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - web-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tradecal.rule=Host(`tradecal.seawealthy.com`)"
      - "traefik.http.routers.tradecal.entrypoints=websecure"
      - "traefik.http.routers.tradecal.tls=true"
      - "traefik.http.routers.tradecal.tls.certresolver=letsencrypt"
      - "traefik.http.services.tradecal.loadbalancer.server.port=80"

networks:
  haiyingping-net:
    driver: bridge
  web-proxy:
    name: web-proxy
    driver: bridge
