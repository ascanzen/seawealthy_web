<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TradeCal</title>
  <style>
    :root {
      color: #17212d;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }
    main {
      width: min(520px, calc(100% - 40px));
      padding: 32px;
      border: 1px solid #dce3ea;
      border-radius: 8px;
      background: #fff;
    }
    h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: 0; }
    p { margin: 0; color: #526174; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>TradeCal</h1>
    <p>服务正在准备中。</p>
  </main>
</body>
</html>
